name: Linux Vulkan build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake git pkg-config             libvulkan-dev vulkan-tools glslc             libx11-dev libxrandr-dev libxinerama-dev             libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -DCAO_RENDERER=VULKAN
      - name: Build
        run: cmake --build build --parallel
